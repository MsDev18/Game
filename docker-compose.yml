services: 
  mysql:
    container_name: mysql
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - 3307:3306
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: game
      MYSQL_USER: game
      MYSQL_PASSWORD: game-pass
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - game_network
  
  phpmyadmin:
    container_name: phpmyadmin
    image: phpmyadmin:latest
    restart: unless-stopped
    ports:
      - 8080:80
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    networks:
      - game_network

volumes:
  mysql_data:

networks:
  game_network:
    driver: bridge